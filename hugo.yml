baseURL: "https://vincatech.net/"
local: "en-au"
title: "Vincatech"
theme: "PaperMod"

pagination:
  pagerSize: 10

enableRobotsTXT: true

params:
  env: production
  description: "A small tech blog about Linux, Raspberry Pi, Docker, homelabs and other projects."
  author: "Vincent"
  mainSections:
    - posts
  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true

  comments: true

  assets:
    favicon16x16: "/favicon-16x16.ico"
    favicon32x32: "/favicon-32x32.ico"

  homeInfoParams:
    Title: "Tech Blog"
    Content: "Notes, projects and things I've learned along the way."

  socialIcons:
    - name: github
      url: "https://github.com/YOUR-USERNAME"
    - name: rss
      url: "/index.xml"

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10

    - identifier: guides
      name: Guides
      url: /guides/
      weight: 20

    - identifier: projects
      name: Projects
      url: /projects/
      weight: 30

    - identifier: tags
      name: Tags
      url: /tags/
      weight: 40

    - identifier: search
      name: Search
      url: /search/
      weight: 50

outputs:
  home:
    - HTML
    - RSS
    - JSON
